name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests (fail-fast)
        run: npm run test:ci

  full-checks:
    runs-on: ubuntu-latest
    needs: fast-checks
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: greek360_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d greek360_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIGRATION_VERIFY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/greek360_verify
      VITE_APP_ENV: dev
      VITE_SUPABASE_URL: https://placeholder-project-ref.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify migration rollback (up/down)
        run: npm run migration:verify

      - name: Seed verification database
        run: npm run db:seed:test

      - name: Coverage run
        run: npm run test:coverage

      - name: Enforce coverage thresholds
        run: npm run coverage:check

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke baseline
        run: npm run test:e2e

      - name: Security baseline tests
        run: npm run test:security
