project_id = "greek-360-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
enabled = true
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:4173",
  "https://greek360.app",
]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.sms]
enable_signup = true
template = "Your Greek 360 verification code is {{ .Code }}."
max_frequency = "60s"
